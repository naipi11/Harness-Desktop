# Keyless replay counterpart of agent-instructions.cordis.yml. Patches do not
# compose across includes, so this applies the scenario config and model swap
# directly to the live tree.
- id: base
  name: '@harness-desktop/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@harness-desktop/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@harness-desktop/dsh-acp-demo'
        config:
          harnessHome: !!js harnessHome
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? harnessHomePath('sessions')
          persistenceCompression: 'none'
          workspaceContext:
            maxBytes: 65536
            harnessHome: !!js harnessHome
            projectRootMarkers:
              - .dsh-project
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: llm-replay
            name: '@harness-desktop/dsh-llm-replay'
          - id: workspace-context-compaction
            name: './tests/fixtures/workspace-context-compaction.ts'
