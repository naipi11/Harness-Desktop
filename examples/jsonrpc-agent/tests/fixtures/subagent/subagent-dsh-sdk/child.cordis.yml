# The CHILD runtime for the SDK subagent composition test: a complete
# stdio JSON-RPC harness whose scripted model echoes its process cwd. The
# parent's subagent-sdk backend spawns this composition per run; stdout is
# reserved for JSON-RPC frames.
- id: sdk-jsonrpc-server
  name: '@harness-desktop/dsh-sdk-jsonrpc-server'

- id: child-mock-llm
  name: './child-mock-llm.ts'

- id: agent-core
  name: '@harness-desktop/dsh-agent-spine-demo'
  config:
    harnessHome: !!js harnessHome
    persona: 'Echo where you run.'
    workspaceContext: false
    skills:
      enabled: false
    toolBash:
      enableRunInBackground: false
    toolJobs: false

# The child receives its own Harness home from the driving e2e, so both
# complete applications retain one writable root while their logs stay isolated.
- id: sessions
  name: '@harness-desktop/dsh-session-persistence-jsonl'
  config:
    root: !!js harnessHomePath('sessions')
    compression: none

- id: session-checkpoints
  name: '@harness-desktop/dsh-session-checkpoint-policy'

# bash-local executes through the subprocess seam.
- id: subprocess
  name: '@harness-desktop/dsh-subprocess-local'

- id: bash
  name: '@harness-desktop/dsh-bash-local'
  config:
    cwd: !!js process.env.DSH_CWD ?? process.cwd()
