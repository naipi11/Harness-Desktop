- id: agent-spine
  config:
    harnessHome: !!js harnessHome
    agents:
      - id: main
        provider: cli-mock
        model: cli-mock
        cwd: !!js process.cwd()
    workspaceContext:
      maxBytes: 65536
    persona: |
      You are headless-agent, a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and
      factual.

- insert:
    - id: cli-mock-llm
      name: './snapshot-fixtures/cli-mock-llm.ts'
