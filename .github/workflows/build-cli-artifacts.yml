name: Build CLI artifacts

on:
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  push:
    tags:
      - 'dsh-v*'

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: dsh ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            target: node24-linux-x64
            runner: ubuntu-24.04
            archive: tar.gz
            deb_arch: amd64
          - label: Linux arm64
            target: node24-linux-arm64
            runner: ubuntu-24.04-arm
            archive: tar.gz
            deb_arch: arm64
          - label: Windows x64
            target: node24-win-x64
            runner: windows-2025
            archive: zip
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-fetch-${{ matrix.target }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pkg-fetch-${{ matrix.target }}-
      - name: Install (immutable)
        run: pnpm install --frozen-lockfile
      - name: Build CLI artifact
        env:
          DSH_CLI_TARGET: ${{ matrix.target }}
        run: pnpm run build:cli-exe
      - name: Verify archive checksum (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: cd dist-cli && sha256sum -c ./*.${{ matrix.archive }}.sha256
      - name: Verify archive checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $checksums = @(Get-ChildItem dist-cli -File -Filter "*.${{ matrix.archive }}.sha256")
          if ($checksums.Count -ne 1) { throw "expected exactly one archive checksum" }
          $line = (Get-Content $checksums[0].FullName).Trim()
          $parts = $line -split '\s+', 2
          if ($parts.Count -ne 2) { throw "invalid checksum file" }
          if ((Get-FileHash (Join-Path dist-cli $parts[1]) -Algorithm SHA256).Hash.ToLower() -ne $parts[0].ToLower()) { throw "checksum mismatch" }
      - name: Build Debian package
        if: startsWith(matrix.target, 'node24-linux-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes dpkg-dev
          archive=$(find dist-cli -maxdepth 1 -type f -name "dsh-*-$(echo '${{ matrix.target }}' | sed 's/^node24-//').tar.gz" -print -quit)
          if [[ -z "$archive" ]]; then echo "CLI archive is missing for ${{ matrix.target }}" >&2; exit 1; fi
          tar -xzf "$archive" -C dist-cli
          exe=$(find dist-cli -maxdepth 1 -type f -name "dsh-*-$(echo '${{ matrix.target }}' | sed 's/^node24-//')" -print -quit)
          if [[ -z "$exe" ]]; then echo "CLI executable is missing for ${{ matrix.target }}" >&2; exit 1; fi
          version="${GITHUB_REF_NAME#dsh-v}"
          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then echo "workflow must run from a dsh-v tag" >&2; exit 1; fi
          architecture='${{ matrix.deb_arch }}'
          pnpm exec tsx scripts/package-cli-installers.ts --format deb --input "$exe" --version "$version" --architecture "$architecture"
          deb="dist-cli/dsh_${version}_${architecture}.deb"
          test -f "$deb" && test -f "$deb.sha256"
          dpkg-deb --info "$deb" | grep -F "Architecture: $architecture"
          sudo dpkg -i "$deb"
          /usr/bin/dsh --version
          sudo dpkg -r dsh
      - name: Build Windows setup installer
        if: matrix.target == 'node24-win-x64'
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.0 --allow-downgrade --force --no-progress --yes
          $installedVersion = [version](choco list --local-only --exact innosetup --limit-output | ForEach-Object { ($_ -split '\|', 2)[1] } | Select-Object -First 1)
          if ($installedVersion -ne [version]'6.7.0') { throw "expected Inno Setup 6.7.0, found $installedVersion" }
          $archive = Get-ChildItem dist-cli -File -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $archive) { throw 'CLI archive is missing for node24-win-x64' }
          Expand-Archive $archive.FullName -DestinationPath dist-cli -Force
          $exe = Get-ChildItem dist-cli -File -Filter '*.exe' | Where-Object { $_.Name -notlike '*setup*' } | Select-Object -First 1
          if ($null -eq $exe) { throw 'CLI executable is missing for node24-win-x64' }
          $version = '${{ github.ref_name }}'.Replace('dsh-v','')
          pnpm exec tsx scripts/package-cli-installers.ts --format windows --input $exe.FullName --version $version
          $installer = Get-ChildItem dist-cli -File -Filter '*-setup.exe' | Select-Object -First 1
          if ($null -eq $installer) { throw 'Windows setup installer was not generated' }
          Start-Process $installer.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          & "$env:LOCALAPPDATA\DeepSeek Harness\dsh.exe" --version
          $uninstaller = Get-ChildItem "$env:LOCALAPPDATA\DeepSeek Harness" -File -Filter 'unins*.exe' | Select-Object -First 1
          if ($null -eq $uninstaller) { throw 'Windows setup uninstaller was not generated' }
          & $uninstaller.FullName '/VERYSILENT' '/SUPPRESSMSGBOXES' '/NORESTART'
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-${{ matrix.target }}
          path: |
            dist-cli/*.${{ matrix.archive }}
            dist-cli/*.${{ matrix.archive }}.sha256
            dist-cli/dsh_*.deb
            dist-cli/dsh_*.deb.sha256
            dist-cli/dsh-*-setup.exe
            dist-cli/dsh-*-setup.exe.sha256
          if-no-files-found: error
          retention-days: 14
